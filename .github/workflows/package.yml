name: Package Desktop Apps

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release after packaging"
        type: boolean
        required: false
        default: false
      tag_name:
        description: "Release tag, for example v1.3.8. If empty, a manual tag is generated."
        type: string
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Electron 43 requires Node >= 22.12; keep this in sync with package.json.
  NODE_VERSION: "22"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # node-gyp drives Python + MSBuild.  The hosted image ships a very new
      # Python (3.15) and Visual Studio 2026; pin Python so the native build is
      # not affected by image updates.  node-gyp >= 12.1 knows VS 2026.
      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # electron-builder only warns when an extraResources source is missing, so
      # a Windows build without the addon would succeed silently and ship an app
      # with no WASAPI exclusive output.  Build it (and verify it) first.
      - name: Build WASAPI exclusive addon
        run: npm run wasapi:build

      - name: Verify native assets
        shell: pwsh
        run: |
          $wasapiAddon = 'native/wasapi-exclusive/build/Release/wasapi_exclusive.node'
          if (-not (Test-Path -LiteralPath $wasapiAddon)) {
            throw "WASAPI addon was not built: $wasapiAddon"
          }
          if (-not (Test-Path -LiteralPath 'build/Release/qrc_decode.node')) {
            Write-Warning 'build/Release/qrc_decode.node is missing; QR decoding will be unavailable in the packaged app.'
          }

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sollin-windows
          if-no-files-found: error
          path: |
            release/*.exe

  build-macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder --mac dmg zip --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sollin-macos-x64
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  build-macos-arm:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sollin-macos-arm64
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder --linux --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sollin-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs:
      - build-windows
      - build-macos-intel
      - build-macos-arm
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG_INPUT="${{ inputs.tag_name }}"
            if [[ -n "$TAG_INPUT" ]]; then
              TAG="$TAG_INPUT"
            else
              TAG="manual-${GITHUB_RUN_ID}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check tag against package version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          if [[ "$TAG" != "v$PKG_VERSION" && "$TAG" != manual-* ]]; then
            echo "::warning::Tag $TAG does not match package.json version v$PKG_VERSION; electron-builder will name artifacts with v$PKG_VERSION."
          fi

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
